name: Spotify Controller CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # JOB 1: COMPILE THE CODE
  build:
    name: Build Firmware (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v3
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run Build
        run: pio run

  # JOB 2: CLEAN CODE & AI REVIEW
  review:
    name: AI Clean Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Essential for posting comments
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # AI needs full history to see the 'diff'

      - name: Gemini AI Code Review
        # Using a specialized action for inline PR reviews
        uses: sshnaidm/gemini-code-review-action@v2
        with:
          gemini-key: ${{ secrets.GEMINI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }} # Provided by GitHub automatically
          model: "gemini-3-flash"
          prompt: |
            You are an expert Embedded Systems Engineer. 
            Review this Pull Request for an ESP32-C3 Spotify Controller.
            - Check for C++ "Clean Code" principles.
            - Identify memory leaks or risky pointer arithmetic.
            - Flag SPI bus conflicts or inefficient display updates for the ILI9341.
            - Ensure the reactive state machine is robust.
            Leave comments directly on the lines of code that need improvement.