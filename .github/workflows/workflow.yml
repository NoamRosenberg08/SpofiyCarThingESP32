name: Spotify Controller CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # JOB 1: COMPILE THE CODE
  # This ensures your ESP32-C3 code actually compiles before reviewing it
  build:
    name: Build Firmware (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v3
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run Build
        run: pio run

  # JOB 2: AI CODE REVIEW
  # This job will now correctly receive your API Key
  review:
    name: Gemini AI Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gemini Code Review
        uses: sshnaidm/gemini-code-review-action@v2
        with:
          gemini-key: ${{ secrets.GEMINI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Updated to a 2026 stable model ID
          model: "gemini-3-flash-preview"
          prompt: |
            You are an expert C++ and Embedded Systems engineer. 
            Review this ESP32-C3 code for:
            1. Clean Code, good code habits, SOLID principles, and maintainability.
            2. Memory efficiency (avoiding fragmentation in long-running states).
            3. Thread safety for the Spotify state machine.
